# پنل React فقط فایل‌های استاتیک SPA را سرو می‌کند.
# پروکسی /api /device-api /media /ws در nginx گیت‌وی (کانتینر nginx پروژه) انجام می‌شود:
#   location /          → proxy_pass http://panel:80;   (SPA)
#   location /api/      → proxy_pass http://api:8000;
#   location /device-api/ → proxy_pass http://api:8000;
#   location /media/    → proxy_pass http://api:8000;
#   location /ws/       → proxy_pass http://api:8000; (با Upgrade/Connection headers)
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA — همه مسیرها به index.html
    location / {
        try_files $uri /index.html;
    }

    # کش طولانی برای فایل‌های هش‌دار بیلد
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # index.html هرگز کش نشود
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
