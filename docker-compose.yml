# ---------------------------------------------------------------------------
# سامانه مدیریت نمایشگرهای آسانسور — استقرار با Docker Compose
# سرویس‌ها (SRS §15): gateway | panel | api | worker | scheduler | db | redis
# ---------------------------------------------------------------------------
name: digital-signage

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-signage}
      POSTGRES_USER: ${POSTGRES_USER:-signage}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-signage} -d ${POSTGRES_DB:-signage}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: ./server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment: &api_env
      MODE: api
      SECRET_KEY: ${SECRET_KEY:-please-change-in-.env}
      DEBUG: ${DEBUG:-0}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-*}
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:-signage}
      POSTGRES_USER: ${POSTGRES_USER:-signage}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      REDIS_URL: redis://redis:6379/0
      MEDIA_ROOT: /data/media
      STATIC_ROOT: /data/static
      MAX_UPLOAD_GB: ${MAX_UPLOAD_GB:-2}
      DJANGO_SUPERUSER_USERNAME: ${DJANGO_SUPERUSER_USERNAME:-admin}
      DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD:-change-me}
      DJANGO_SUPERUSER_EMAIL: ${DJANGO_SUPERUSER_EMAIL:-admin@example.local}
    volumes:
      - media_data:/data/media
      - static_data:/data/static
      - backup_data:/data/backups

  worker:
    build: ./server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *api_env
      MODE: worker
    volumes:
      - media_data:/data/media
      - static_data:/data/static
      - backup_data:/data/backups

  scheduler:
    build: ./server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *api_env
      MODE: beat
    volumes:
      - media_data:/data/media
      - static_data:/data/static
      - backup_data:/data/backups

  panel:
    build: ./panel
    restart: unless-stopped
    depends_on:
      - api

  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - api
      - panel
    ports:
      - "${GATEWAY_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - media_data:/var/www/media:ro

volumes:
  postgres_data:
  redis_data:
  media_data:
  static_data:
  backup_data:
