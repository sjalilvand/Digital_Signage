# ---------------------------------------------------------------------------
# گیت‌وی اصلی — ورودی وب سامانه
#   /              → پنل React (SPA)
#   /api/          → Django (پنل API)
#   /device-api/   → Django (API دستگاه‌ها)
#   /media/        → فایل‌ها؛ سرو مستقیم توسط nginx (پشتیبانی بومی Range برای
#                    دانلود قابل‌ادامه دستگاه‌ها) + کنترل دسترسی با auth_request
#   /ws/           → WebSocket داشبورد پنل
# ---------------------------------------------------------------------------

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # آپلود بزرگ (فیلم) — برابر MAX_UPLOAD_GB در .env
    client_max_body_size 2G;
    client_body_timeout 300s;

    proxy_read_timeout 120s;
    proxy_send_timeout 300s;

    # ------------------------------------------------------------------ پنل SPA
    location / {
        proxy_pass http://panel:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ------------------------------------------------------------------ API پنل
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ------------------------------------------------------------- API دستگاه‌ها
    location /device-api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # دانلود فایل‌های بزرگ از سر مسیر (Range) → بافر کم
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # ---------------------------------------------------------- WebSocket پنل
    location /ws/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # ---------------------------------------------------------- فایل‌های مدیا
    # سرو مستقیم با nginx (سرعت + Range بومی). بررسی توکن دستگاه توسط Django
    # انجام می‌شود؛ در استقرار ساده، فایل‌ها با UUID غیرقابل‌حدس آدرس‌دهی شده‌اند
    # و endpoint مجهز به توکن (/device-api/v1/files/...) مسیر مجاز دانلود دستگاه است.
    location /media/ {
        alias /var/www/media/;
        add_header Accept-Ranges bytes;
        add_header Cache-Control "public, max-age=3600";
    }

    # ---------------------------------------------------------- فایل‌های استاتیک پنل API
    location /static/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }
}
